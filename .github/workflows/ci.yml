name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: pip install .

      - name: Test
        run: pip install pytest && pytest -q

      - name: Validate UI JavaScript
        run: node --check app/vpn_bench/static/app.js

      - name: Validate wheel assets
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import glob
          import zipfile
          wheel = glob.glob("dist/*.whl")[-1]
          with zipfile.ZipFile(wheel) as z:
              assert any(name.startswith("vpn_bench/static/") for name in z.namelist())
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t vpn-bench:ci .
