app:
  host: 0.0.0.0
  port: 8080
  database: /app/data/vpn-bench.sqlite3

providers: []

benchmark:
  update_interval_seconds: 1
  default_duration_seconds: 600
  default_mode: equal_time
  retention_days: 90
  probe_interval_seconds: 15
  dns_domain: example.com
  http_targets:
    - https://example.com/
  # Optional controlled throughput endpoint. Leave unset for normal screening.
  # throughput_download_url: https://bench.example.com/100m.bin
  throughput_sample_seconds: 0
  # Optional whitelist-sensitive URLs. Keep this list separate from normal HTTP targets.
  # whitelist_targets:
  #   - https://example-whitelist-target.example/
