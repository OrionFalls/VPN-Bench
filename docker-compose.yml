services:
  vpn-bench:
    build: .
    container_name: vpn-bench
    restart: unless-stopped
    environment:
      VPN_BENCH_CONFIG: /app/config/config.yaml
      VPN_BENCH_DATA_DIR: /app/data
      VPN_BENCH_SECRET: ${VPN_BENCH_SECRET}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8080/health\")"]
      interval: 10s
      timeout: 3s
      retries: 5
