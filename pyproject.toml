[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vpn-bench"
version = "0.2.0"
description = "Self-hosted automated VPN server benchmarking and long-term monitoring"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "cryptography>=45,<47",
]

[project.scripts]
vpn-bench = "vpn_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app/vpn_bench"]

[tool.hatch.build.targets.wheel.force-include]
"app/vpn_bench/static" = "vpn_bench/static"
