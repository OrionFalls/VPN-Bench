<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#3478f6"/><stop offset="1" stop-color="#6c5ce7"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="620" rx="28" fill="#f5f7fb"/>
<text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">VPN-Bench architecture</text>
<text x="70" y="105" font-family="Arial,sans-serif" font-size="18" fill="#748199">Isolated VPN execution · repeatable probes · historical measurements</text>
<g filter="url(#s)">
<rect x="70" y="155" width="220" height="115" rx="18" fill="#172033"/><text x="180" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">Web UI / API</text><text x="180" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#b8c3d7">Controller · FastAPI</text>
<rect x="340" y="155" width="220" height="115" rx="18" fill="white" stroke="#dfe5ef"/><text x="450" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Worker</text><text x="450" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#748199">privileged runtime</text>
<rect x="610" y="155" width="220" height="115" rx="18" fill="white" stroke="#dfe5ef"/><text x="720" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">Network NS</text><text x="720" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#748199">one namespace / job</text>
<rect x="880" y="155" width="250" height="115" rx="18" fill="url(#g)"/><text x="1005" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">VPN runtime</text><text x="1005" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#e9edff">LX · Extended · WG · Xray</text>
</g>
<g stroke="#91a0b8" stroke-width="3" fill="none"><path d="M290 212h45"/><path d="M560 212h45"/><path d="M830 212h50"/></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#748199"><text x="307" y="198">job</text><text x="575" y="198">isolate</text><text x="845" y="198">connect</text></g>
<rect x="70" y="350" width="1060" height="185" rx="22" fill="white" stroke="#dfe5ef" filter="url(#s)"/>
