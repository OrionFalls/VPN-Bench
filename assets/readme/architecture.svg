<rect x="440" y="425" width="145" height="62" rx="14" fill="#eef3fb"/><text x="512" y="462" text-anchor="middle">HTTP / TLS</text>
<rect x="610" y="425" width="145" height="62" rx="14" fill="#eef3fb"/><text x="682" y="462" text-anchor="middle">Latency / loss</text>
